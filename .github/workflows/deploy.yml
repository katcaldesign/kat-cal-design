# Deploys the site to GitHub Pages on every push to main.
#
# How it works: GitHub spins up a fresh machine, installs the project,
# runs `next build` (which, thanks to output:"export" in next.config.ts,
# writes plain HTML/CSS/JS into ./out), and publishes that folder to Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Rebuild every morning so the contribution graph on the info page keeps up
  # with reality. The site is a static export, so the only way the numbers
  # change is if the site is built again. 06:00 UTC, nothing depends on the
  # exact time, and GitHub runs scheduled jobs late when it is busy.
  #
  # WORTH KNOWING: GitHub disables scheduled workflows in a public repo after
  # 60 days with no activity. It emails first, and one click in the Actions tab
  # turns it back on. Any push resets the clock.
  schedule:
    - cron: "0 6 * * *"
  # Lets you re-run the deploy by hand from the Actions tab if ever needed.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GH_CONTRIBUTIONS_TOKEN is a repo secret: a personal access token with
      # the `read:user` scope. scripts/fetch-contributions.mjs uses it to pull
      # the real contribution calendar from GitHub's GraphQL API.
      #
      # It cannot be named GITHUB_something, because GitHub reserves that
      # prefix for its own secrets. And the automatic GITHUB_TOKEN that Actions
      # provides is scoped to this repository, not to your profile, so it
      # cannot read the calendar either.
      #
      # Without the secret the script leaves the committed JSON alone and the
      # build carries on, so a fork or a revoked token costs a stale graph
      # rather than a failed deploy.
      - name: Build static site
        env:
          GH_CONTRIBUTIONS_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
        run: npm run build

      - name: Upload site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
