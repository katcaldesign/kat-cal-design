# Deploys the site to GitHub Pages on every push to main.
#
# How it works: GitHub spins up a fresh machine, installs the project,
# runs `next build` (which, thanks to output:"export" in next.config.ts,
# writes plain HTML/CSS/JS into ./out), and publishes that folder to Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Lets you re-run the deploy by hand from the Actions tab if ever needed.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
